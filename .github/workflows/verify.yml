name: verify

# tests:          every push - unit tests, then the MeTTa tests on SWI-Prolog 10 + PeTTa v1.0.4 + Omega
# llm-benchmark:  manual, or a push whose commit message contains [llm] - premises from a local
#                 open-weights model via Ollama (no API key), sources recorded live; results are
#                 committed back to benchmark/results/
on:
  push:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model for the real-LLM benchmark
        default: qwen2.5:7b

env:
  PETTA_REF: v1.0.4        # the PeTTa version Omega's Dockerfile pins
  OMEGA_REF: 63a7826       # Omega commit the plugin was verified against

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SWI-Prolog 10
        run: |
          sudo add-apt-repository -y ppa:swi-prolog/stable
          sudo apt-get update -q
          sudo apt-get install -y -q swi-prolog-nox
          swipl --version
      - name: Fetch PeTTa and Omega
        run: |
          git clone -q --depth 1 --branch "$PETTA_REF" https://github.com/trueagi-io/PeTTa "$RUNNER_TEMP/PeTTa"
          git clone -q https://github.com/singnet/Omega "$RUNNER_TEMP/PeTTa/repos/Omega"
          git -C "$RUNNER_TEMP/PeTTa/repos/Omega" checkout -q "$OMEGA_REF"
          echo "PETTA_PATH=$RUNNER_TEMP/PeTTa" >> "$GITHUB_ENV"
          echo "OMEGA_PATH=$RUNNER_TEMP/PeTTa/repos/Omega" >> "$GITHUB_ENV"
          echo "PETTA_RUN=$GITHUB_WORKSPACE/tools/petta_run.sh" >> "$GITHUB_ENV"
      - name: Install package and plugin
        run: |
          python -m pip install -q janus-swi pyyaml requests
          sh plugin/install.sh "$OMEGA_PATH"
          python -m pip install -q -e '.[dev]'
      - name: Tests
        run: python -m pytest -v

  llm-benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[llm]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      MODEL: ${{ inputs.model || 'qwen2.5:7b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama and model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama pull "$MODEL"
      - name: Benchmark
        run: |
          python -m pip install -q -e .
          out="benchmark/results/ollama-$(echo "$MODEL" | tr ':/' '--')"
          omega-ground-bench --llm ollama --model "$MODEL" --transport record --out "$out"
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT" benchmark/cassettes/sources.json
          git commit -m "chore(bench): record real-LLM benchmark with $MODEL" || exit 0
          git pull --rebase -q && git push
